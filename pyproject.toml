[project]
name = "nashville-council-digest"
version = "0.1.0"
description = "Plain-language, cited digests of Nashville Metro Council meetings, built from the city's Legistar records, with code that checks every number, place and outcome against the official text."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Nathanael Johnson", email = "nathanaeljdj@gmail.com" }
]
dependencies = []

[project.scripts]
council-digest = "council_digest.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["live: calls the real Legistar API (deselected by default)"]
addopts = "-m 'not live'"

[tool.hatch.build.targets.wheel]
packages = ["src/council_digest"]
